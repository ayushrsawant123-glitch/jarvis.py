<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>JARVIS | Personal Assistant</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #0b1020;
      color: #f4f7ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #99a5bf;
      --line: rgba(168, 185, 221, .14);
      --cyan: #67e8f9;
      --panel: rgba(18, 27, 49, .82);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 16% 8%, rgba(43, 110, 177, .2), transparent 38rem),
        radial-gradient(ellipse at 90% 88%, rgba(54, 77, 154, .18), transparent 34rem),
        #0b1020;
    }

    button { font: inherit; }

    .page {
      width: min(100% - 40px, 1050px);
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0 42px;
    }

    .brand, .status-pill, .section-heading, .button-content {
      display: flex;
      align-items: center;
    }

    .brand { gap: 12px; }

    .brand-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid rgba(103, 232, 249, .34);
      border-radius: 13px;
      background: rgba(103, 232, 249, .09);
      color: var(--cyan);
      font-size: 20px;
      font-weight: 700;
    }

    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: .12em; }
    .brand-caption { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .status-pill {
      gap: 9px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(18, 27, 49, .62);
      color: #c3cde0;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #74819b;
      box-shadow: 0 0 10px rgba(116, 129, 155, .45);
    }

    .status-pill[data-state="active"] .status-dot {
      background: #4ade80;
      box-shadow: 0 0 12px rgba(74, 222, 128, .65);
    }

    .status-pill[data-state="error"] .status-dot { background: #fb7185; }

    .intro { max-width: 650px; margin-bottom: 28px; }
    .eyebrow { color: var(--cyan); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 12px 0 10px; font-size: clamp(34px, 6vw, 54px); letter-spacing: -.045em; line-height: 1.08; }
    .intro p { max-width: 560px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(250px, .85fr);
      gap: 18px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .16);
      backdrop-filter: blur(12px);
    }

    .control-card { padding: clamp(20px, 4vw, 32px); }

    .section-heading { justify-content: space-between; gap: 12px; }
    h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .small-label { color: var(--muted); font-size: 12px; }

    .visualizer {
      position: relative;
      display: grid;
      min-height: 220px;
      margin: 22px 0;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(168, 185, 221, .1);
      border-radius: 15px;
      background:
        linear-gradient(rgba(123, 151, 204, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123, 151, 204, .035) 1px, transparent 1px),
        rgba(8, 14, 29, .55);
      background-size: 28px 28px;
    }

    #mic-visualizer { position: absolute; width: 100%; height: 100%; inset: 0; }

    .mic-core {
      z-index: 1;
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      border: 1px solid rgba(103, 232, 249, .38);
      border-radius: 50%;
      background: rgba(21, 39, 62, .88);
      box-shadow: 0 0 40px rgba(65, 205, 234, .12);
      color: var(--cyan);
      font-size: 27px;
      pointer-events: none;
    }

    .visualizer-caption {
      position: absolute;
      z-index: 2;
      right: 12px;
      bottom: 12px;
      left: 12px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button-content { justify-content: center; gap: 9px; }

    .button {
      min-height: 46px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 11px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .button:hover:not(:disabled) { transform: translateY(-1px); }
    .button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .button:disabled { cursor: wait; opacity: .65; }
    .button-primary { background: var(--cyan); color: #07131b; }
    .button-primary:hover:not(:disabled) { background: #a5f3fc; }
    .button-secondary { border-color: var(--line); background: rgba(255, 255, 255, .035); color: #e2e9f7; }
    .button-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, .075); }

    .message { min-height: 20px; margin: 13px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .message[data-state="error"] { color: #fda4af; }
    .message[data-state="success"] { color: #86efac; }

    .side-card { padding: 23px; }
    .side-card h2 { margin-bottom: 18px; }
    .steps { display: grid; gap: 18px; margin: 0; padding: 0; list-style: none; }
    .step { display: grid; grid-template-columns: 30px 1fr; gap: 11px; align-items: start; }
    .step-number {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
    }
    .step strong { display: block; margin: 1px 0 4px; font-size: 13px; }
    .step span { display: block; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .note { margin: 21px 0 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.6; }
    footer { padding-top: 25px; color: #69758e; font-size: 11px; text-align: center; }
    .feature-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
    .feature-card { min-width: 0; padding: 23px; }
    .feature-card h2 { margin-bottom: 16px; }
    .feature-card-wide { grid-column: 1 / -1; }
    .form-row { display: flex; flex-wrap: wrap; gap: 9px; margin: 10px 0; }
    .field { min-width: 0; flex: 1 1 150px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; background: #0b1325; color: #f4f7ff; font: inherit; font-size: 12px; }
    .field:focus { outline: 2px solid var(--cyan); outline-offset: 1px; }
    .field-label { display: grid; flex: 1 1 145px; gap: 7px; color: var(--muted); font-size: 11px; }
    .feature-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .feature-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; color: #dce5f7; font-size: 12px; line-height: 1.5; }
    .feature-list a { color: var(--cyan); }
    .feature-list small { display: block; color: var(--muted); }
    .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .mini-button { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: #dce5f7; cursor: pointer; font: inherit; font-size: 11px; }
    .mini-button:hover { border-color: var(--cyan); }
    .empty-state { color: var(--muted); font-size: 12px; }
    .check-label { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
    .command-form { display: flex; gap: 9px; }
    .command-form .field { flex: 1; }
    #command-result, #weather-result { min-height: 20px; margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    @media (max-width: 700px) { .feature-grid { grid-template-columns: 1fr; } .feature-card-wide { grid-column: auto; } }

    @media (max-width: 700px) {
      .page { width: min(100% - 28px, 540px); padding-top: 20px; }
      header { padding-bottom: 34px; }
      .dashboard { grid-template-columns: 1fr; }
      .visualizer { min-height: 190px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    #chat-panel {
      width: min(520px, calc(100vw - 32px));
      margin: 20px auto 0;
      padding: 14px;
      border: 1px solid rgba(0, 255, 247, 0.45);
      border-radius: 8px;
      background: rgba(8, 20, 28, 0.72);
      box-sizing: border-box;
    }
    #chat-log {
      min-height: 44px;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 10px;
      color: #fff;
      text-align: left;
    }
    #chat-log p { margin: 6px 0; overflow-wrap: anywhere; }
    #chat-form { display: flex; gap: 8px; }
    #chat-input {
      min-width: 0;
      flex: 1;
      padding: 10px;
      border: 1px solid #5a7b86;
      border-radius: 4px;
      background: #102630;
      color: #fff;
      font: inherit;
    }
    #chat-form button {
      padding: 0 16px;
      border: 0;
      border-radius: 4px;
      background: #00fff7;
      color: #102027;
      font: inherit;
      cursor: pointer;
    }
    #chat-status { min-height: 1.2em; margin: 8px 0 0; color: #ffd166; }
    @media (max-height: 760px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .container { margin: 24px 0; }
      #mic-visualizer { height: 140px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JARVIS 2.0</h1>
    <div class="subtitle">Say something to see the voice waves!</div>
    <canvas id="mic-visualizer" width="400" height="200"></canvas>
    <button id="start-btn">Start Listening</button>
    <button onclick="fetch('/start_jarvis', {method:'POST'}).then(r=>r.json()).then(d=>alert(d.status));">Start JARVIS</button>
    <section id="chat-panel" aria-label="Text chat">
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Type a message..." aria-label="Message" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
      <p id="chat-status" role="status"></p>
    </section>
  </div>
  <script>
    const canvas = document.getElementById('mic-visualizer');
    const ctx = canvas.getContext('2d');
    let audioContext, analyser, dataArray, source;
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatLog = document.getElementById('chat-log');
    const chatStatus = document.getElementById('chat-status');

    function addChatMessage(speaker, text) {
      const line = document.createElement('p');
      line.textContent = `${speaker}: ${text}`;
      chatLog.appendChild(line);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    chatForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      addChatMessage('You', message);
      chatInput.value = '';
      chatStatus.textContent = 'JARVIS is responding...';
      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Message could not be sent.');
        addChatMessage('JARVIS', data.reply);
        chatStatus.textContent = '';
      } catch (error) {
        chatStatus.textContent = error.message;
      }
    });

    function drawVisualizer() {
      if (!analyser) return;
      const bounds = canvas.getBoundingClientRect();
      const samples = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(samples);
      context.clearRect(0, 0, bounds.width, bounds.height);
      context.beginPath();
      context.lineWidth = 2;
      context.strokeStyle = "#67e8f9";
      context.shadowColor = "rgba(103, 232, 249, .65)";
      context.shadowBlur = 12;
      const step = bounds.width / samples.length;
      for (let i = 0; i < samples.length; i += 1) {
        const x = i * step;
        const y = (samples[i] / 255) * bounds.height;
        if (i === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      context.stroke();
      context.shadowBlur = 0;
      animationFrame = requestAnimationFrame(drawVisualizer);
    }

    function stopVisualizer() {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      if (microphoneStream) microphoneStream.getTracks().forEach((track) => track.stop());
      if (audioContext && audioContext.state !== "closed") audioContext.close();
      animationFrame = undefined;
      microphoneStream = undefined;
      audioContext = undefined;
      analyser = undefined;
      resizeCanvas();
      visualizerButton.disabled = false;
      visualizerButton.querySelector(".button-content span:last-child").textContent = "Preview microphone";
      visualizerState.textContent = "Visualizer off";
      visualizerCaption.textContent = "Microphone preview is off";
    }

    visualizerButton.addEventListener("click", async () => {
      if (microphoneStream) {
        stopVisualizer();
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        assistantMessage.textContent = "Microphone preview is not supported by this browser.";
        assistantMessage.dataset.state = "error";
        return;
      }

      visualizerButton.disabled = true;
      assistantMessage.textContent = "";
      assistantMessage.dataset.state = "";
      try {
        microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(microphoneStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        visualizerButton.querySelector(".button-content span:last-child").textContent = "Stop microphone preview";
        visualizerState.textContent = "Microphone active";
        visualizerCaption.textContent = "Live microphone input";
        drawVisualizer();
      } catch (error) {
        stopVisualizer();
        assistantMessage.textContent = error.name === "NotAllowedError"
          ? "Microphone access was denied. Allow microphone access in your browser settings and try again."
          : "Could not start the microphone preview. Check that a microphone is connected and try again.";
        assistantMessage.dataset.state = "error";
      } finally {
        visualizerButton.disabled = false;
      }
    });

    assistantButton.addEventListener("click", async () => {
      if (microphoneStream) stopVisualizer();
      assistantButton.disabled = true;
      assistantMessage.textContent = "Starting JARVIS…";
      assistantMessage.dataset.state = "";
      assistantStatus.dataset.state = "idle";
      assistantStatusText.textContent = "Starting assistant";

      try {
        const response = await fetch("/start_jarvis", { method: "POST" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "The server could not start JARVIS.");
        assistantMessage.textContent = result.status || "JARVIS started. Follow the voice prompts in the app.";
        assistantMessage.dataset.state = "success";
        assistantStatus.dataset.state = "active";
        assistantStatusText.textContent = "Assistant started";
      } catch (error) {
        assistantMessage.textContent = error.message || "Could not connect to JARVIS. Make sure the local server is running.";
        assistantMessage.dataset.state = "error";
        assistantStatus.dataset.state = "error";
        assistantStatusText.textContent = "Could not start";
        assistantButton.disabled = false;
      }
    });

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("beforeunload", stopVisualizer);
    resizeCanvas();

    const commandForm = document.getElementById("command-form");
    const commandInput = document.getElementById("command-input");
    const commandResult = document.getElementById("command-result");
    const taskList = document.getElementById("task-list");
    const historyList = document.getElementById("history-list");
    const settingsMessage = document.getElementById("settings-message");
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[character]);

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "The request could not be completed.");
      return result;
    }

    async function loadTasks() {
      const items = await requestJson("/api/tasks");
      taskList.innerHTML = items.length ? items.map((item) => `
        <li><span>${escapeHtml(item.title)}${item.due_at ? `<small>${escapeHtml(new Date(item.due_at).toLocaleString())}</small>` : ""}</span>
          <span class="item-actions">${item.completed ? "<small>Completed</small>" : `<button class="mini-button" data-complete="${item.id}">Complete</button>`}
          <button class="mini-button" data-delete="${item.id}" aria-label="Delete ${escapeHtml(item.title)}">Delete</button></span></li>`).join("")
        : '<li class="empty-state">No tasks or calendar events yet.</li>';
    }

    async function loadHistory() {
      const entries = await requestJson("/api/history");
      historyList.innerHTML = entries.length ? entries.map((entry) => `
        <li><span>${escapeHtml(entry.command)}<small>${escapeHtml(entry.response)} · ${escapeHtml(entry.source)} · ${new Date(entry.created_at).toLocaleString()}</small></span>
        <span class="small-label">${escapeHtml(entry.status)}</span></li>`).join("")
        : '<li class="empty-state">No activity yet.</li>';
    }

    async function loadNews() {
      const list = document.getElementById("news-list");
      try {
        const headlines = await requestJson("/api/news");
        list.innerHTML = headlines.length ? headlines.map((item) => {
          const link = /^https:\/\//i.test(item.link) ? item.link : "#";
          return `<li><a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a></li>`;
        }
        ).join("") : '<li class="empty-state">No headlines are available.</li>';
      } catch (error) {
        list.innerHTML = `<li class="empty-state">${escapeHtml(error.message)} Check your internet connection.</li>`;
      }
    }

    async function loadSettings() {
      const settings = await requestJson("/api/settings");
      document.getElementById("setting-wake-word").value = settings.wake_word;
      document.getElementById("setting-city").value = settings.city;
      document.getElementById("weather-city").value = settings.city;
      document.getElementById("setting-speed").value = settings.speech_rate;
      document.getElementById("speed-value").value = `${settings.speech_rate} wpm`;
      document.getElementById("setting-offline").checked = settings.offline_mode === "true";
      document.getElementById("setting-model").value = settings.offline_model_path;
      document.getElementById("setting-voice").innerHTML = '<option value="">System default</option>' + settings.voices.map((voice) =>
        `<option value="${escapeHtml(voice.id)}">${escapeHtml(voice.name)}</option>`
      ).join("");
      document.getElementById("setting-voice").value = settings.voice_id;
    }

    async function refreshAssistantStatus() {
      try {
        const state = await requestJson("/api/status");
        assistantStatus.dataset.state = state.error ? "error" : state.active ? "active" : "idle";
        assistantStatusText.textContent = state.error ? "Assistant issue" : state.listening ? "Listening" : state.active ? "Assistant active" : "Assistant offline";
        if (state.error) {
          assistantMessage.textContent = state.error;
          assistantMessage.dataset.state = "error";
        }
        assistantButton.disabled = Boolean(state.active);
        assistantButton.querySelector(".button-content span:last-child").textContent = state.active ? "JARVIS is running" : "Start JARVIS";
      } catch (error) {
        assistantStatus.dataset.state = "error";
        assistantStatusText.textContent = "Server unavailable";
      }
    }

    commandForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      commandResult.textContent = "Working…";
      try {
        const result = await requestJson("/api/command", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: commandInput.value })
        });
        commandResult.textContent = result.response;
        commandInput.value = "";
        await Promise.all([loadTasks(), loadHistory()]);
      } catch (error) {
        commandResult.textContent = error.message;
      }
    });

    document.getElementById("command-mic").addEventListener("click", () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        commandResult.textContent = "Voice input is not supported in this browser. Use the offline Vosk mode in the running JARVIS assistant or type a command.";
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.onresult = (event) => {
        commandInput.value = event.results[0][0].transcript;
        commandForm.requestSubmit();
      };
      recognition.onerror = (event) => {
        commandResult.textContent = event.error === "not-allowed"
          ? "Microphone access was denied. Allow microphone access in browser settings."
          : `Voice input failed (${event.error}). Try again or type a command.`;
      };
      recognition.start();
    });

    document.getElementById("weather-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const city = document.getElementById("weather-city").value.trim();
      const output = document.getElementById("weather-result");
      output.textContent = "Loading weather…";
      try {
        const weather = await requestJson(`/api/weather?city=${encodeURIComponent(city)}`);
        output.textContent = `${weather.city}, ${weather.country}: ${weather.condition}, ${weather.temperature}° (feels like ${weather.feels_like}°), humidity ${weather.humidity}%.`;
      } catch (error) {
        output.textContent = error.message;
      }
    });

    document.getElementById("refresh-news").addEventListener("click", loadNews);
    document.getElementById("task-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const dueInput = document.getElementById("task-due").value;
      try {
        await requestJson("/api/tasks", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: document.getElementById("task-title").value,
            kind: document.getElementById("task-kind").value,
            due_at: dueInput ? new Date(dueInput).toISOString() : ""
          })
        });
        event.target.reset();
        await loadTasks();
      } catch (error) {
        commandResult.textContent = error.message;
      }
    });

    taskList.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-complete], button[data-delete]");
      if (!button) return;
      const id = button.dataset.complete || button.dataset.delete;
      try {
        await requestJson(`/api/tasks/${id}`, button.dataset.complete
          ? { method: "PATCH" } : { method: "DELETE" });
        await loadTasks();
      } catch (error) {
        commandResult.textContent = error.message;
      }
    });

    document.getElementById("setting-speed").addEventListener("input", (event) => {
      document.getElementById("speed-value").value = `${event.target.value} wpm`;
    });
    document.getElementById("settings-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      settingsMessage.textContent = "Saving…";
      try {
        const result = await requestJson("/api/settings", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            wake_word: document.getElementById("setting-wake-word").value,
            city: document.getElementById("setting-city").value,
            speech_rate: Number(document.getElementById("setting-speed").value),
            voice_id: document.getElementById("setting-voice").value,
            offline_mode: document.getElementById("setting-offline").checked,
            offline_model_path: document.getElementById("setting-model").value
          })
        });
        settingsMessage.textContent = result.status;
        settingsMessage.dataset.state = "success";
      } catch (error) {
        settingsMessage.textContent = error.message;
        settingsMessage.dataset.state = "error";
      }
    });

    Promise.all([loadTasks(), loadHistory(), loadSettings()]).catch((error) => {
      assistantMessage.textContent = `Dashboard setup failed: ${error.message}`;
      assistantMessage.dataset.state = "error";
    });
    loadNews();
    refreshAssistantStatus();
    window.setInterval(() => {
      refreshAssistantStatus();
      loadHistory().catch((error) => {
        document.getElementById("history-caption").textContent = error.message;
      });
    }, 5000);
  </script>
</body>
</html>
