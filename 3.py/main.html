<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JARVIS 2.0 Main</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #2c5364, #1c92d2);
      color: #00fff7;
      font-family: 'Orbitron', Arial, sans-serif;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 2.5em;
      letter-spacing: 0.15em;
      text-shadow: 0 0 20px #00fff7, 0 0 40px #00fff7;
      margin-bottom: 0.5em;
      animation: neon 1.5s infinite alternate;
    }
    @keyframes neon {
      from { text-shadow: 0 0 10px #00fff7, 0 0 20px #00fff7; }
      to   { text-shadow: 0 0 40px #00fff7, 0 0 80px #00fff7; }
    }
    .subtitle {
      font-size: 1.1em;
      color: #fff;
      opacity: 0.7;
      margin-bottom: 2em;
    }
    #mic-visualizer {
      display: block;
      margin: 0 auto;
      background: transparent;
    }
    #start-btn {
      margin-top: 2em;
      padding: 12px 32px;
      font-size: 1.2em;
      border: none;
      border-radius: 30px;
      background: #00fff7;
      color: #222;
      font-family: 'Orbitron', Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 0 20px #00fff7;
      transition: background 0.2s;
    }
    #start-btn:hover {
      background: #1c92d2;
      color: #fff;
    }
    #chat-panel {
      width: min(520px, calc(100vw - 32px));
      margin: 20px auto 0;
      padding: 14px;
      border: 1px solid rgba(0, 255, 247, 0.45);
      border-radius: 8px;
      background: rgba(8, 20, 28, 0.72);
      box-sizing: border-box;
    }
    #chat-log {
      min-height: 44px;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 10px;
      color: #fff;
      text-align: left;
    }
    #chat-log p { margin: 6px 0; overflow-wrap: anywhere; }
    #chat-form { display: flex; gap: 8px; }
    #chat-input {
      min-width: 0;
      flex: 1;
      padding: 10px;
      border: 1px solid #5a7b86;
      border-radius: 4px;
      background: #102630;
      color: #fff;
      font: inherit;
    }
    #chat-form button {
      padding: 0 16px;
      border: 0;
      border-radius: 4px;
      background: #00fff7;
      color: #102027;
      font: inherit;
      cursor: pointer;
    }
    #chat-status { min-height: 1.2em; margin: 8px 0 0; color: #ffd166; }
    @media (max-height: 760px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .container { margin: 24px 0; }
      #mic-visualizer { height: 140px; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css?family=Orbitron:700" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>JARVIS 2.0</h1>
    <div class="subtitle">Say something to see the voice waves!</div>
    <canvas id="mic-visualizer" width="400" height="200"></canvas>
    <button id="start-btn">Start Listening</button>
    <button onclick="fetch('/start_jarvis', {method:'POST'}).then(r=>r.json()).then(d=>alert(d.status));">Start JARVIS</button>
    <section id="chat-panel" aria-label="Text chat">
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Type a message..." aria-label="Message" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
      <p id="chat-status" role="status"></p>
    </section>
  </div>
  <script>
    const canvas = document.getElementById('mic-visualizer');
    const ctx = canvas.getContext('2d');
    let audioContext, analyser, dataArray, source;
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatLog = document.getElementById('chat-log');
    const chatStatus = document.getElementById('chat-status');

    function addChatMessage(speaker, text) {
      const line = document.createElement('p');
      line.textContent = `${speaker}: ${text}`;
      chatLog.appendChild(line);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    chatForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;

      addChatMessage('You', message);
      chatInput.value = '';
      chatStatus.textContent = 'JARVIS is responding...';
      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Message could not be sent.');
        addChatMessage('JARVIS', data.reply);
        chatStatus.textContent = '';
      } catch (error) {
        chatStatus.textContent = error.message;
      }
    });

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyser) return;
      analyser.getByteTimeDomainData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#00fff7";
      let sliceWidth = canvas.width * 1.0 / dataArray.length;
      let x = 0;
      for(let i = 0; i < dataArray.length; i++) {
        let v = dataArray[i] / 128.0;
        let y = v * canvas.height/2;
        if(i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
        x += sliceWidth;
      }
      ctx.lineTo(canvas.width, canvas.height/2);
      ctx.stroke();
      // Draw mic icon in the center
      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(canvas.width/2, canvas.height/2, 32, 0, 2 * Math.PI);
      ctx.fillStyle = "#222";
      ctx.fill();
      ctx.strokeStyle = "#00fff7";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.font = "32px Arial";
      ctx.fillStyle = "#00fff7";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🎤", canvas.width/2, canvas.height/2+2);
      ctx.restore();
    }

    document.getElementById('start-btn').onclick = async function() {
      if (!navigator.mediaDevices) {
        alert("Microphone access not supported in this browser.");
        return;
      }
      this.disabled = true;
      this.innerText = "Listening...";
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      source = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.fftSize);
      source.connect(analyser);
      drawVisualizer();
    };
  </script>
</body>
</html>
